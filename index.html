<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link rel="apple-touch-icon" href="apple-touch-icon.png.jpeg">
  </head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>حاسبة الذهب البحرينية</title>
    <style>
      body{font-family:system-ui;background:#f8f5ef;color:#302719;max-width:650px;margin:30px auto;padding:16px}
      main{background:white;padding:24px;border-radius:18px;box-shadow:0 4px 25px #0001}
      label{display:block;margin-top:14px}
      input,select,button{font:inherit;padding:12px;border:1px solid #b9ab8d;border-radius:10px;box-sizing:border-box;width:100%}
      button{background:#80652f;color:white;margin-top:14px;cursor:pointer}
      output{display:block;background:#f6f0df;padding:16px;border-radius:10px;margin-top:18px;line-height:2}
      small{color:#685e4b}
    
    </style>
  </head>
  <body>
    <main>
      <h1>حاسبة الذهب 🇧🇭</h1>
      <p>احسبي قيمة ذهبك وسعر البيع التقريبي للمحل بالدينار البحريني.</p>
      <label>الوزن بالجرام<input id="weight" type="number" min="0" step="0.01" value="28.50"></label>
      <label>العيار<select id="karat"><option>18</option><option selected>21</option><option>22</option><option>24</option></select></label>
      <label>سعر جرام الذهب عيار 24 اليوم (د.ب.)<input id="price24" type="number" min="0" step="0.001" placeholder="أدخلي سعر اليوم"></label><button id="refresh">محاولة جلب السعر المباشر</button>
      <p id="status"><small>السعر غير محدّث. يمكنك إدخال سعر عيار 24 يدويًا.</small>
      </p><label>خصم المحل لكل جرام (د.ب.)<input id="discount" type="number" min="0" step="0.1" value="1"></label><label>سعر الشراء الأصلي (د.ب.)<input id="paid" type="number" min="0" step="0.01" value="910"></label>
      <button id="calculate">احسبي السعر</button><output id="result">أدخلي سعر الذهب واضغطي احسبي السعر.</output>
      <button onclick="document.getElementById('weight').value=14.38;calc()">قطعة 14.38 جرام</button>
      <button onclick="document.getElementById('weight').value=14.12;calc()">قطعة 14.12 جرام</button>
      <button onclick="document.getElementById('weight').value=28.5;calc()">القطعتان 28.50 جرام</button>
      <p><small>هذه تقديرات وليست عرض شراء من محل. تأكدي من سعر شراء المحل والوزن الصافي. تحديث السعر يعتمد على توفر خدمة الإنترنت ومصدر البيانات.</small></p>
    </main><script>const $=id=>document.getElementById(id);function calc(){let w=+$('weight').value,k=+$('karat').value,p=+$('price24').value,d=+$('discount').value,paid=+$('paid').value;if(!(w>0&&p>0)){ $('result').textContent='أدخلي وزنًا وسعرًا صالحين.';return}let gram=p*k/24,gross=gram*w,net=Math.max(0,gram-d)*w;$('result').innerHTML=`سعر جرام عيار ${k}: <b>${gram.toFixed(3)} د.ب.</b><br>قيمة الذهب: <b>${gross.toFixed(2)} د.ب.</b><br>تقدير البيع بعد الخصم: <b>${net.toFixed(2)} د.ب.</b><br>الفرق عن سعر الشراء: <b>${(net-paid).toFixed(2)} د.ب.</b>`} $('calculate').onclick=calc;['weight','karat','price24','discount','paid'].forEach(id=>$(id).addEventListener('input',calc));$('refresh').onclick=async()=>{ $('status').textContent='جارٍ محاولة تحديث السعر...';try{let r=await fetch('https://api.gold-api.com/price/XAU');if(!r.ok)throw Error('network');let j=await r.json();if(!(j.price>0))throw Error('data');const b=0.376;let price=j.price*b/31.1034768;$('price24').value=price.toFixed(3);$('status').textContent='تم جلب السعر العالمي التقريبي وتحويله للدينار البحريني. المصدر: gold-api.com. تأكدي من سعر الصرف وسعر المحل.';calc()}catch(e){$('status').textContent='تعذر جلب السعر تلقائيًا. أدخلي سعر عيار 24 يدويًا.'}};</script></body></html>
